{{ define "main" }}
<div class="container gptl-people"><h1>{{ .Title }}</h1>
{{ range .Params.sections }}<section class="people-group gptl-section-grid" id="{{ .id }}"><header><h2>{{ .content.title }}</h2></header><div>{{ .content.text | markdownify | replaceRE "<h2" "<h3" | replaceRE "</h2>" "</h3>" | safeHTML }}</div></section>{{ end }}
</div>{{ end }}
