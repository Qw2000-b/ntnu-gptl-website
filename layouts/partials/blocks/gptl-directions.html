{{ $c := partial "homepage-content.html" .wcBlock }}
{{ $en := eq site.Language.Lang "en" }}
<div class="col-12 gptl-directions editorial-grid">
  <header><p class="section-label">02</p><h2>{{ cond $en $c.heading $c.label }}</h2></header>
  <div class="directions-text">
    <div class="directions-intro"><p>{{ cond $en $c.subtitle $c.subtitle_zh }}</p></div>
    {{ range $c.directions }}
    <h3>{{ cond $en .title .title_zh }}</h3>
    <p>{{ cond $en .description .description_zh }}</p>
    {{ end }}
  </div>
</div>
