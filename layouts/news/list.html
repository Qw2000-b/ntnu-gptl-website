{{ define "main" }}
{{ $en := eq site.Language.Lang "en" }}
{{ partial "news-style.html" . }}
<div class="gptl-news news-archive container">
<a class="news-back text-link gptl-button" href="{{ "/#news" | relLangURL }}">{{ cond $en "Back to Home" "回首頁" }} <span aria-hidden="true">→</span></a>
<h1>{{ .Title }}</h1>{{ partial "news-list.html" (dict "limit" 0) }}</div>{{ end }}
