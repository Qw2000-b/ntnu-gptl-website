    url: '#about'      # 對應到的頁面區塊 ID (連到首頁的關於我們)
    weight: 10         # 排序數字，越小越靠左

  - name: 研究方向
    url: '#projects'   # 連到首頁的研究領域區塊
    weight: 20

  - name: 實驗室成員
    url: 'people/'     # 連到獨立的成員頁面 (content/people/)
    weight: 30

  - name: 論文發表
    url: 'publication/'# 連到獨立的論文頁面
    weight: 40

  - name: 最新消息
    url: '#news'
    weight: 50
