<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="mobile-animation" width="1035" height="297" viewBox="0 0 1035 297" role="img" aria-labelledby="mobile-title mobile-description">
  <title id="mobile-title">Mobile Energy Work Vehicle</title>
  <desc id="mobile-description">A work vehicle tows an energy cabinet. All four wheels rotate counterclockwise; road markings move right. The amber rooftop beacon flashes. Green dots flow from fuel cell and battery to EMS; red dots flow from EMS to the load.</desc>
  <style>.mobile-animation .mobile-dot { animation-timing-function: linear; animation-iteration-count: infinite; animation-delay: var(--delay); }
.mobile-animation .mobile-wheel { transform-box: view-box; animation: mobile-wheel 2s linear infinite; transform-origin: var(--cx) var(--cy); }
.mobile-animation .mobile-wheel-small { animation-duration: 0.8s; }
.mobile-animation .mobile-road { animation: mobile-road 0.9s linear infinite; }
.mobile-animation .mobile-beacon { animation: mobile-beacon 1.6s ease-in-out infinite; }
.mobile-animation .mobile-glow { animation: mobile-glow 1.6s ease-in-out infinite; }
@keyframes mobile-wheel { to { transform: rotate(-360deg); } }
@keyframes mobile-road { to { stroke-dashoffset: -128; } }
@keyframes mobile-beacon { 0%,40%,50%,90%,100% { opacity:0.4; } 10%,20%,60%,70% { opacity:1; } }
@keyframes mobile-glow { 0%,40%,50%,90%,100% { opacity:0; } 10%,20%,60%,70% { opacity:0.85; } }
.mobile-animation .mobile-fc-ems { fill: #22A68A; animation-name: mobile-fc-ems; animation-duration: 0.9s; }
@keyframes mobile-fc-ems {
  0% { transform: translate(779px, 324px); }
  31.48148148% { transform: translate(779px, 307px); }
  100% { transform: translate(816px, 307px); }
}
.mobile-animation .mobile-battery-ems { fill: #22A68A; animation-name: mobile-battery-ems; animation-duration: 0.85s; }
@keyframes mobile-battery-ems {
  0% { transform: translate(938px, 324px); }
  33.33333333% { transform: translate(938px, 307px); }
  100% { transform: translate(904px, 307px); }
}
.mobile-animation .mobile-ems-load { fill: #BB2649; animation-name: mobile-ems-load; animation-duration: 2.22316667s; }
@keyframes mobile-ems-load {
  0% { transform: translate(904px, 296px); }
  100% { transform: translate(1037.39px, 296px); }
}</style>
  <defs><radialGradient id="mobile-beacon-glow"><stop offset="0" stop-color="#FFD966" stop-opacity="0.7" /><stop offset="1" stop-color="#FFD966" stop-opacity="0" /></radialGradient></defs>
