<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="bus-animation" width="1179" height="438" viewBox="0 0 1179 438" role="img" aria-labelledby="bus-title bus-description">
  <title id="bus-title">Fuel Cell Bus</title>
  <desc id="bus-description">Blue dots flow from the hydrogen tank to the fuel cell. Green dots flow from the fuel cell to the battery and motor, and from the battery to the motor. Red dots flow from the motor to the rear wheel. Both wheels rotate counterclockwise.</desc>
  <style>
.bus-animation { --energy-green: #22A68A; --hydrogen-blue: #2F80ED; --motor-red: #BB2649; }
.bus-animation .bus-road { animation: bus-road 0.9s linear infinite; }
@keyframes bus-road { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
.bus-animation .bus-wheel { transform-box: view-box; animation: bus-wheel 2s linear infinite; }
.bus-animation .bus-wheel-front { transform-origin: 318.5px 530px; }
.bus-animation .bus-wheel-rear { transform-origin: 934px 530px; }
.bus-animation .bus-dot { fill: var(--energy-green); animation: bus-fuel-battery 3s linear infinite; animation-delay: var(--delay); }
.bus-animation .bus-hydrogen-fuel { fill: var(--hydrogen-blue); animation-name: bus-hydrogen-fuel; }
.bus-animation .bus-fuel-battery { animation-name: bus-fuel-battery; }
.bus-animation .bus-fuel-motor { animation-name: bus-fuel-motor; }
.bus-animation .bus-battery-motor { animation-name: bus-battery-motor; animation-duration: 2s; }
.bus-animation .bus-motor-wheel { fill: var(--motor-red); animation-name: bus-motor-wheel; animation-duration: 1.8s; }
@keyframes bus-wheel { to { transform: rotate(-360deg); } }
@keyframes bus-hydrogen-fuel {
  from { transform: translate(871px, 243px); }
  to { transform: translate(1019px, 243px); }
}
@keyframes bus-fuel-battery {
  from { transform: translate(1129px, 297px); }
  to { transform: translate(1129px, 443px); }
}
@keyframes bus-fuel-motor {
  0% { transform: translate(1111px, 297px); }
  47.6595745% { transform: translate(1111px, 409px); }
  100% { transform: translate(988px, 409px); }
}
@keyframes bus-battery-motor {
  0% { transform: translate(1111px, 443px); }
  12.1428571% { transform: translate(1111px, 426px); }
  100% { transform: translate(988px, 426px); }
}
@keyframes bus-motor-wheel {
  0% { transform: translate(934px, 452px); opacity: 1; }
  50% { transform: translate(934px, 467.3px); opacity: 1; }
  55.555556%, 100% { transform: translate(934px, 469px); opacity: 0; }
}
/* Animation previews always play, following the user's current preference. */
</style>
