<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="vehicle-animation" width="1353" height="650" viewBox="0 0 1130 650" role="img" aria-labelledby="vehicle-title vehicle-description">
  <title id="vehicle-title">冷藏車能源與熱流動畫</title>
  <desc id="vehicle-description">電池沿灰色路徑供應馬達與 TRU，馬達連接後輪；綠點表示能源方向。橘色箭頭表示熱流，藍色虛線表示 TRU 冷風。</desc>
  <style>
.vehicle-animation { --energy-color: #22A68A; }
.vehicle-animation .vehicle-road { animation: vehicle-road 0.9s linear infinite; }
@keyframes vehicle-road { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
.vehicle-animation .wheel {
  transform-box: view-box;
  animation: vehicle-wheel 2s linear infinite;
}
.vehicle-animation .wheel-front { transform-origin: 243px 615.5px; }
.vehicle-animation .wheel-rear { transform-origin: 779px 615.5px; }
.vehicle-animation .energy-dot {
  fill: var(--energy-color);
  animation: vehicle-energy-battery-motor 3s linear infinite;
  animation-delay: var(--delay);
}
.vehicle-animation .energy-battery-motor {
  animation-name: vehicle-energy-battery-motor;
  animation-duration: 2s;
}
.vehicle-animation .energy-motor-wheel {
  fill: #BB2649;
  animation-name: vehicle-energy-motor-wheel;
  animation-duration: 3.6s;
}
.vehicle-animation .energy-tru {
  animation-name: vehicle-energy-tru;
}
.vehicle-animation .heat-arrow {
  animation: vehicle-heat 3.6s ease-in-out infinite;
}
.vehicle-animation .cool-window {
  stroke-dasharray: 100 100;
  animation: vehicle-cool 2.7s linear infinite;
  animation-delay: var(--delay);
}
.vehicle-animation .cool-line {
  animation: vehicle-air-dashes 0.8s linear infinite;
}
@keyframes vehicle-wheel { to { transform: rotate(-360deg); } }
@keyframes vehicle-energy-battery-motor {
  from { transform: translate(546px, 582px); }
  to { transform: translate(590px, 582px); }
}
@keyframes vehicle-energy-motor-wheel {
  0% { transform: translate(706px, 582px); opacity: 1; }
  50% { transform: translate(725.8px, 582px); opacity: 1; }
  55.555556%, 100% { transform: translate(728px, 582px); opacity: 0; }
}
@keyframes vehicle-energy-tru {
  0% { transform: translate(389px, 581px); }
  5.75% { transform: translate(366px, 581px); }
  100% { transform: translate(366px, 204px); }
}
/* All heat arrows fade together, retaining a faint directional cue. */
@keyframes vehicle-heat {
  0%, 100% { opacity: 0.2; }
  35%, 60% { opacity: 1; }
}
@keyframes vehicle-cool {
  0% { stroke-dashoffset: 100; }
  42%, 58% { stroke-dashoffset: 0; }
  100% { stroke-dashoffset: -100; }
}
@keyframes vehicle-air-dashes { to { stroke-dashoffset: -13.33332; } }
/* This animation test page always plays, as requested by the user. */
</style>
